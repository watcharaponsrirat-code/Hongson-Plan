/* Browser demonstration: keep the familiar layout with readable labels. */

  body { font-size: 16px; }
  label, input, textarea, select, button, .nav button { font-size: 14px; }
  .resource-fields label, .filters label, .form-help, .notice, .reference-check,
  .demo-note, .demo-accounts p, .login-form > p, .panel-header p, .integration-card p,
  .detail-grid dd, .table-wrap td, .empty p { font-size: 14px; }
  .sidebar-foot, .detail-grid dt, .table-wrap th { font-size: 13px; }
  .browser-demo-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 14px 32px; background: #e6f3ef; border-bottom: 1px solid #bfded7; }

function budgetSection(data) {
  const sources = new Map();
  let total = 0;
  for (const resource of list(data.resources)) {
    const amount = resourceLineTotal(resource);
    const source = text(resource.source);
    total += amount;
    sources.set(source, (sources.get(source) || 0) + amount);
  }
  if (!Number.isSafeInteger(total) || total > MONEY_LIMIT) throw new RangeError('ยอดรวมงบประมาณเกินขอบเขต');
  const types = Array.isArray(data.budgetTypes) ? data.budgetTypes : [];
  return `<p><strong class="project-money">${money(total)}</strong> บาท${data.fiscalYear ? ` <span class="project-budget-year">(ปีงบประมาณ ${escapeHtml(data.fiscalYear)})</span>` : ''}</p><p>ประเภทงบประมาณ</p><div class="project-choices">${['อุดหนุน', 'กิจกรรมพัฒนาผู้เรียน', 'บำรุงการศึกษา', 'ระดมทรัพยากร', 'อื่นๆ'].map(type => checkbox(type, types.includes(type))).join('')}<span>ระบุ ${field(data.budgetOther)}</span></div>${sources.size ? `<table class="form-table project-budget-table"><caption>งบประมาณจากรายการทรัพยากร จำแนกตามแหล่งเงิน</caption><thead><tr><th scope="col">แหล่งเงิน</th><th scope="col">จำนวนเงิน (บาท)</th></tr></thead><tbody>${[...sources].map(([source, amount]) => `<tr><td>${field(source)}</td><td class="project-number">${money(amount)}</td></tr>`).join('')}</tbody><tfoot><tr><th scope="row">รวมงบประมาณ</th><td class="project-number">${money(total)}</td></tr></tfoot></table>` : ''}`;
}

function budgetBars(){const groups={};for(const p of state.projects.filter(p=>p.approvedVersionId)){const d=approved(p),b=budget(p);groups[d.group] ||= {approved:0,used:0};groups[d.group].approved+=b.approved;groups[d.group].used+=b.paid+b.reserved}return Object.entries(groups).map(([g,b])=>`<div class="budget-line"><div><strong>${esc(g)}</strong><span>${money(b.used)} / ${money(b.approved)} บาท</span></div><div class="progress-track"><div class="progress-fill" style="width:${b.approved?Math.min(100,b.used/b.approved*100):0}%"></div></div></div>`).join('') || empty('ยังไม่มีงบอนุมัติ','เมื่อ ผอ.อนุมัติ ระบบจะแสดงภาพรวมที่นี่')}

function comparableProjectValue(value){
  if(value===undefined||value===null)return '';
  if(Array.isArray(value)){const rows=value.map(comparableProjectValue).filter(row=>row!=='');return rows.length?rows:'';}
  if(typeof value==='object'){const entries=Object.entries(value).map(([key,item])=>[key,comparableProjectValue(item)]).filter(([,item])=>item!=='').sort(([a],[b])=>a.localeCompare(b));return entries.length?Object.fromEntries(entries):'';}
  return value;
}
function collectProject(form,prefix='p'){
  const data={};
  for(const el of $$(`[name^="${prefix}."]`,form))data[el.name.slice(prefix.length+1)]=el.value.trim();
  data.standards=(data.standards||'').split('\n').map(x=>x.trim()).filter(Boolean);
  data.implementationSteps=$$('[data-implementation-row]',form).map(row=>({stage:$('[name="step.stage"]',row).value,activity:$('[name="step.activity"]',row).value.trim(),period:$('[name="step.period"]',row).value.trim(),responsible:$('[name="step.responsible"]',row).value.trim()})).filter(row=>row.activity||row.period||row.responsible);
  data.evaluationRows=$$('[data-evaluation-row]',form).map(row=>({indicator:$('[name="evaluation.indicator"]',row).value.trim(),method:$('[name="evaluation.method"]',row).value.trim(),tool:$('[name="evaluation.tool"]',row).value.trim()})).filter(row=>row.indicator||row.method||row.tool);
  data.budgetTypes=$$('[name="budgetType"]:checked',form).map(el=>el.value);
  data.signatories=Object.fromEntries($$('[name^="signature."]',form).map(el=>[el.name.slice(10),el.value.trim()]));
  data.strategicProjectReference=JSON.parse($('[data-strategic-reference]',form)?.value||'{}');
  Object.assign(data,collectProjectReferences(form,state.schoolReferenceCatalog));
  data.resources=$$('[data-resource]',form).map(card=>{const r={};for(const el of $$('[name^="r."]',card))r[el.name.slice(2)]=el.value.trim();r.quantity=Number(r.quantity);r.unitPrice=satang(r.unitPrice);if(card.dataset.resourceId)r.id=card.dataset.resourceId;r.spending=$$('.spending-row',card).map(row=>({month:$('[name=month]',row).value,amount:satang($('[name=amount]',row).value)})).filter(s=>s.month);return r});
  return data;
}
function recalcResources(form){
  let total=0,invalid=false;
  for(const card of $$('[data-resource]',form)){
    try {
      const quantity=Number($('[name="r.quantity"]',card).value), unitPrice=satang($('[name="r.unitPrice"]',card).value);
      const n=resourceLineTotal({quantity,unitPrice});total+=n;
      $('[data-resource-total]',card).textContent=money(n);
      const spent=$$('[name=amount]',card).reduce((a,el)=>a+satang(el.value),0);
      $('[data-spend-check]',card).textContent=`รวมแผนใช้เงิน ${money(spent)} บาท${spent!==n?` · ยังต่างจากยอดรายการ ${money(n-spent)} บาท`:' · ตรงกับยอดรายการ'}`;
    }catch(error){invalid=true;$('[data-resource-total]',card).textContent='ตรวจสอบจำนวน / ราคา';$('[data-spend-check]',card).textContent=error.message}
  }
  $$('[data-grand-total]',form).forEach(el=>el.textContent=invalid?'ยังคำนวณไม่ได้':money(total));
}

function summaryForm(id='',pid=''){const s=state.summaries.find(s=>s.id===id);const available=state.projects.filter(p=>my(p)&&p.approvedVersionId&&(!state.summaries.some(s=>s.projectId===p.id)||p.id===s?.projectId));pid=s?.projectId||pid||available[0]?.id;const p=project(pid);if(!p){showModal('สร้างสรุปโครงการ',empty('ยังไม่มีกิจกรรมให้สรุป','ต้องเป็นกิจกรรมที่อนุมัติแล้วและยังไม่มีสรุป หากเคยบันทึกไว้ให้เปิดรายการเดิม'));return}const d=s?.data || {};showModal(s?'แก้ไขสรุปโครงการ':'สร้างสรุปโครงการ',`<form id="summary-form" data-id="${id}" data-version="${s?.version || ''}" data-evidence="${esc(JSON.stringify(d.evidence || []))}">${select('projectId','กิจกรรมที่อนุมัติ',available.map(p=>({value:p.id,label:p.data.title})),pid,null)}<details style="margin:17px 0"><summary>ข้อมูลจากฉบับอนุมัติที่ใช้สรุป</summary>${projectDetails(s?.projectSnapshot || approved(p))}</details>${notice(`งบอนุมัติ ${money(budget(p).approved)} บาท · จ่ายจริงที่การเงินยืนยัน ${money(budget(p).paid)} บาท`,true)}<div class="form-grid">${input('actualDate','วันที่จัดกิจกรรมจริง *',d.actualDate,'date')}${input('participants','ผู้เข้าร่วมจริง (คน) *',d.participants ?? '', 'number','min="0" step="1"')}${input('success','ความสำเร็จของกิจกรรม (%) *',d.success ?? '', 'number','min="0" max="100" step="0.01"')}${select('coverType','รูปแบบหน้าปก',[{value:'subject',label:'แบบกลุ่มสาระ'},{value:'administration',label:'แบบงานตามกลุ่มบริหาร'}],d.coverType || 'subject',null)}${area('outcome','ผลดำเนินงานจริง *',d.outcome)}</div><h3 class="form-section">แบบประเมินความพึงพอใจ</h3>${notice('แบบประเมิน 8 ข้อ ข้อละ 1–4 คะแนน · ขณะนี้ใช้หัวข้อหมายเลข รอปรับข้อความตามแบบประเมินต้นฉบับโรงเรียน')}<div class="score-grid">${Array.from({length:8},(_,i)=>select(`score${i}`,`ข้อ ${i+1}`,[{value:1,label:'1 คะแนน'},{value:2,label:'2 คะแนน'},{value:3,label:'3 คะแนน'},{value:4,label:'4 คะแนน'}],d.scores?.[i] ?? '','ยังไม่ตอบ')).join('')}</div><p class="muted" style="margin-top:12px">ร้อยละความพึงพอใจ = คะแนนรวม ÷ 32 × 100 <strong id="score-preview">${scorePercent(d)}%</strong></p><h3 class="form-section">ปัญหาและการแก้ไข</h3><p class="form-help">เลือก “ไม่มีปัญหา” เมื่อตรวจแล้วไม่มีปัญหา ช่องที่ยังไม่ตอบจะไม่ถูกนับว่าไม่มีปัญหา</p>${categories.map(category=>{const p=d.problems?.find(p=>p.category===category)||{};return `<div class="problem-card" data-problem="${category}"><h3>${category}</h3>${select('problemStatus','สถานะ',[{value:'unanswered',label:'ยังไม่ตอบ'},{value:'none',label:'ไม่มีปัญหา'},{value:'problem',label:'มีปัญหา'}],p.status||'unanswered',null)}<div class="form-grid" style="margin-top:12px">${input('cause','ปัญหา / สาเหตุ',p.cause)}${input('solution','แนวทางแก้ไข',p.solution)}${input('result','ผลการแก้ไข',p.result)}${input('suggestion','ข้อเสนอแนะ',p.suggestion)}</div></div>`}).join('')}${area('suggestions','ข้อเสนอแนะเพิ่มเติม',d.suggestions)}<h3 class="form-section">ภาพและหลักฐาน</h3>${attachmentLinks(d.evidence)}<label>แนบหลักฐาน (ไฟล์ละไม่เกิน 5 MB)<input type="file" name="evidence" multiple accept="image/*,.pdf,.txt,.csv"></label><div class="error" role="alert"></div><div class="modal-footer">${btn('ยกเลิก','close')}<button type="submit" class="primary">บันทึกฉบับร่าง</button></div></form>`,true)}
function summaryDetails(s){return `<dl class="detail-grid"><div><dt>วันที่จัดจริง</dt><dd>${dateText(s.data.actualDate)}</dd></div><div><dt>ผู้เข้าร่วม</dt><dd>${s.data.participants ?? '—'} คน</dd></div><div><dt>จ่ายเงินจริง ณ วันส่งสรุป</dt><dd>${money(s.actualPaid)} บาท</dd></div><div><dt>ความสำเร็จ</dt><dd>${s.data.success ?? '—'}%</dd></div><div><dt>ความพึงพอใจ</dt><dd>${scorePercent(s.data)}%</dd></div><div class="full"><dt>ผลดำเนินงาน</dt><dd>${esc(s.data.outcome)}</dd></div></dl><h3 class="form-section">ผลประเมิน 8 ข้อ</h3><p>${(s.data.scores||[]).map((v,i)=>`ข้อ ${i+1}: ${esc(v||'ยังไม่ตอบ')}`).join(' · ')}</p><h3 class="form-section">ปัญหาและข้อเสนอแนะ</h3><div class="table-wrap"><table><thead><tr><th>หมวด</th><th>สถานะ / สาเหตุ</th><th>การแก้ไข / ผล / ข้อเสนอแนะ</th></tr></thead><tbody>${(s.data.problems||[]).map(p=>`<tr><td>${esc(p.category)}</td><td>${({none:'ไม่มีปัญหา',problem:'มีปัญหา',unanswered:'ยังไม่ตอบ'})[p.status]}<small>${esc(p.cause)}</small></td><td>${esc(p.solution)}<small>ผล: ${esc(p.result || '—')}</small><small>ข้อเสนอแนะ: ${esc(p.suggestion || '—')}</small></td></tr>`).join('')}</tbody></table></div><p class="text-pre" style="margin:16px 0">${esc(s.data.suggestions)}</p>${attachmentLinks(s.data.evidence)}`}
function viewSummary(id){const s=state.summaries.find(s=>s.id===id);let actions='';if(s.ownerId===boot.user.id&&['draft','returned'].includes(s.status))actions+=btn('แก้ไขร่าง','edit-summary',id)+btn('ส่งตรวจ','transition',id,'primary','data-kind="summary" data-decision="submit"');if(has('planner','plan_head')&&s.status==='submitted')actions+=btn('ส่งคืน','transition',id,'danger','data-kind="summary" data-decision="return"')+btn('ตรวจรับสรุป','transition',id,'primary','data-kind="summary" data-decision="accept"');showModal('สรุปผลโครงการ',`<div class="actions"><h2>${esc(title(s.projectId))}</h2>${badge(s.status)}</div><div class="actions" style="margin:18px 0">${actions}${btn('ตัวอย่างสรุปพร้อมหน้าปก','print-summary',id)}</div>${summaryDetails(s)}<h3 class="form-section">ประวัติ</h3>${historyHtml(id)}<div class="error" role="alert"></div>`,true)}
function filtersHtml(){const data=state.projects.map(p=>approved(p)||p.data);const unique=key=>[...new Set(data.map(d=>d[key]).filter(Boolean))].sort();return `<form id="report-filter-form" class="filters">${select('fiscalYear','ปีงบประมาณ',unique('fiscalYear'),reportFilters.fiscalYear,'ทุกปีงบประมาณ')}${select('academicYear','ปีการศึกษา',unique('academicYear'),reportFilters.academicYear,'ทุกปีการศึกษา')}${select('term','ภาคเรียน',['1','2'],reportFilters.term,'ทุกภาคเรียน')}${select('group','กลุ่มงาน',unique('group'),reportFilters.group,'ทุกกลุ่มงาน')}${select('projectId','กิจกรรม',state.projects.map(p=>({value:p.id,label:p.data.title})),reportFilters.projectId,'ทุกกิจกรรม')}${select('source','แหล่งเงิน',[...new Set(data.flatMap(d=>(d.resources||[]).map(r=>r.source)))],reportFilters.source,'ทุกแหล่งเงิน')}<button type="submit" class="primary">กรองข้อมูล</button>${btn('ล้าง','clear-filters','','small')}</form>`}
function filteredProjects(){return state.projects.filter(p=>{const d=approved(p);return d&&(!reportFilters.projectId||p.id===reportFilters.projectId)&&['fiscalYear','academicYear','term','group'].every(k=>!reportFilters[k]||String(d[k])===reportFilters[k])&&(!reportFilters.source||d.resources.some(r=>r.source===reportFilters.source))})}
function budgetRows(){return filteredProjects().flatMap(p=>Object.entries(budget(p).bySource).filter(([source])=>!reportFilters.source||source===reportFilters.source).map(([source,b])=>({p,source,...b})))}
function budgetTable(){const rows=budgetRows();return rows.length?`<div class="table-wrap"><table><thead><tr><th>กิจกรรม / กลุ่มงาน</th><th>แหล่งเงิน</th><th class="number">อนุมัติ</th><th class="number">กันไว้</th><th class="number">จ่ายจริง</th><th class="number">คงเหลือใช้ได้</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${btn(esc(r.p.data.title),'view-project',r.p.id,'link')}<small>${esc(approved(r.p).group)} · ปี ${esc(approved(r.p).fiscalYear)} / ภาค ${esc(approved(r.p).term)}</small></td><td>${esc(r.source)}</td>${['approved','reserved','paid','available'].map(k=>`<td class="number">${money(r[k])}</td>`).join('')}</tr>`).join('')}<tr><td colspan="2"><strong>รวมทั้งหมด (บาท)</strong></td>${['approved','reserved','paid','available'].map(k=>`<td class="number"><strong>${money(rows.reduce((a,r)=>a+r[k],0))}</strong></td>`).join('')}</tr></tbody></table></div>`:empty('ยังไม่มีงบอนุมัติตามเงื่อนไข')}
function allocationTable(){const rows=state.allocations.filter(a=>['fiscalYear','term','group','source'].every(k=>!reportFilters[k]||String(a[k])===reportFilters[k]));return rows.length?`<div class="table-wrap"><table><thead><tr><th>ปี / ภาคเรียน / กลุ่มงาน</th><th>แหล่งเงิน</th><th class="number">ประมาณรายรับ</th><th class="number">กรอบจัดสรร</th><th></th></tr></thead><tbody>${rows.map(a=>`<tr><td>${esc(a.fiscalYear)} / ${esc(a.term)}<small>${esc(a.group)}</small></td><td>${esc(a.source)}</td><td class="number">${money(a.income)}</td><td class="number">${money(a.allocated)}</td><td>${has('planner','plan_head')?btn('แก้ไข','edit-allocation',a.id,'small'):''}</td></tr>`).join('')}</tbody></table></div>`:empty('ยังไม่มีข้อมูลประมาณรายรับและจัดสรร','งานแผนบันทึกข้อมูลนี้แยกจากยอดอนุมัติโครงการ')}
function renderBudget(){$('#page').innerHTML=heading('งบประมาณและยอดคงเหลือ','คงเหลือใช้ได้ = งบอนุมัติล่าสุด − จ่ายจริงสะสม − กันไว้ค้างจ่าย',has('planner','plan_head')?btn('＋ รายรับ / กรอบจัดสรร','new-allocation','','primary'):'')+filtersHtml()+`<section class="panel"><div class="panel-header"><h2>งบตามกิจกรรมและแหล่งเงิน</h2>${btn('ส่งออก CSV','export','budget','small')}</div>${budgetTable()}</section><section class="panel"><div class="panel-header"><h2>ประมาณการรายรับและกรอบจัดสรร</h2></div>${allocationTable()}</section>`}
function allocationForm(id=''){const a=state.allocations.find(a=>a.id===id)||{};showModal('ประมาณรายรับ / กรอบจัดสรร',`<form id="allocation-form" data-id="${id}" data-version="${a.version || ''}"><div class="form-grid">${input('fiscalYear','ปีงบประมาณ *',a.fiscalYear||2570,'number','required')}${select('term','ภาคเรียน *',['1','2'],a.term||'2',null)}${input('group','กลุ่มงาน *',a.group,'text','required')}${input('source','แหล่งเงิน *',a.source,'text','required')}${input('income','ประมาณการรายรับ (บาท)',baht(a.income),'number','min="0" step="0.01" required')}${input('allocated','กรอบจัดสรร (บาท)',baht(a.allocated),'number','min="0" step="0.01" required')}${area('note','หมายเหตุ / ที่มา',a.note)}</div><div class="error" role="alert"></div><div class="modal-footer">${btn('ยกเลิก','close')}<button type="submit" class="primary">บันทึกข้อมูล</button></div></form>`)}
function groupedReport(kind){const rows={};for(const p of filteredProjects()){const d=approved(p);for(const r of d.resources.filter(r=>!reportFilters.source||r.source===reportFilters.source)){const total=resourceLineTotal(r);let entries=kind==='strategy'?[[d.strategy || 'ยังไม่ระบุ',total]]:kind==='standards'?(d.standards.length?d.standards:['ยังไม่ระบุ']).map(s=>[s,total]):r.spending.map(s=>{const [y,m]=s.month.split('-').map(Number);return [`ปีงบประมาณ ${y+543+(m>=10?1:0)} · ไตรมาส ${Math.floor(((m+2)%12)/3)+1}`,s.amount]});for(const [key,amount] of entries){rows[key] ||= {ids:new Set(),amount:0};rows[key].ids.add(p.id);rows[key].amount+=amount}}}return Object.keys(rows).length?`<div class="table-wrap"><table><thead><tr><th>${{strategy:'กลยุทธ์',quarter:'ไตรมาสใช้เงิน',standards:'มาตรฐาน'}[kind]}</th><th class="number">จำนวนกิจกรรม</th><th class="number">งบประมาณ (บาท)</th><th>กิจกรรมต้นทาง</th></tr></thead><tbody>${Object.entries(rows).sort().map(([key,v])=>`<tr><td>${esc(key)}</td><td class="number">${v.ids.size}</td><td class="number">${money(v.amount)}</td><td>${[...v.ids].map(id=>btn(esc(title(id)),'view-project',id,'link')).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`:empty('ยังไม่มีข้อมูลอนุมัติตามเงื่อนไข')}
function summaryReport(problems=false){const ids=new Set(filteredProjects().map(p=>p.id));const summaries=state.summaries.filter(s=>ids.has(s.projectId)&&['submitted','accepted','returned'].includes(s.status));if(!summaries.length)return empty('ยังไม่มีสรุปที่ส่งตรวจตามเงื่อนไข');if(problems)return `<div class="table-wrap"><table><thead><tr><th>หมวด / กิจกรรม</th><th>สถานะสรุป</th><th>ปัญหา / สาเหตุ</th><th>การแก้ไข</th><th>ผล / ข้อเสนอแนะ</th></tr></thead><tbody>${summaries.flatMap(s=>(s.data.problems||[]).map(p=>`<tr><td><strong>${esc(p.category)}</strong><small>${esc(title(s.projectId))}</small></td><td>${badge(s.status)}</td><td>${p.status==='none'?'ไม่มีปัญหา':p.status==='unanswered'?'ยังไม่ตอบ':esc(p.cause)}</td><td>${esc(p.solution)}</td><td>${esc(p.result)}<small>${esc(p.suggestion)}</small></td></tr>`)).join('')}</tbody></table></div>`;const groups={};for(const s of summaries){const key=approved(project(s.projectId)).group;groups[key] ||= [];groups[key].push(s)}return `<div class="metrics">${metric('กิจกรรมในรายงาน',summaries.length,'นับสรุปล่าสุดของแต่ละกิจกรรม')}${metric('สำเร็จ ≥ 80%',summaries.filter(s=>Number(s.data.success)>=80).length,'กิจกรรม')}${metric('พึงพอใจ ≥ 80%',summaries.filter(s=>Number(scorePercent(s.data))>=80).length,'กิจกรรม')}${metric('รอตรวจ',summaries.filter(s=>s.status==='submitted').length,'กิจกรรม',true)}</div><div class="table-wrap"><table><thead><tr><th>กลุ่มงาน</th><th class="number">กิจกรรม</th><th class="number">สำเร็จ ≥ 80%</th><th class="number">พึงพอใจ ≥ 80%</th></tr></thead><tbody>${Object.entries(groups).map(([g,ss])=>`<tr><td>${esc(g)}</td><td class="number">${ss.length}</td><td class="number">${ss.filter(s=>Number(s.data.success)>=80).length}</td><td class="number">${ss.filter(s=>Number(scorePercent(s.data))>=80).length}</td></tr>`).join('')}</tbody></table><table><thead><tr><th>กิจกรรม</th><th>สถานะ</th><th class="number">สำเร็จ (%)</th><th class="number">พึงพอใจ (%)</th><th class="number">ใช้เงินจริง ณ ส่งสรุป</th></tr></thead><tbody>${summaries.map(s=>`<tr><td>${btn(esc(title(s.projectId)),'view-summary',s.id,'link')}</td><td>${badge(s.status)}</td><td class="number">${s.data.success}</td><td class="number">${scorePercent(s.data)}</td><td class="number">${money(s.actualPaid)}</td></tr>`).join('')}</tbody></table></div>`}
function renderReports(){const tabs={budget:'งบประมาณ',strategy:'กลยุทธ์',quarter:'ไตรมาส',standards:'วิเคราะห์มาตรฐาน',summaries:'ผลสรุป / ความพึงพอใจ',problems:'รวมปัญหา',plan:'เล่มแผน'};$('#page').innerHTML=heading('รายงานงานแผน','ข้อมูลอนุมัติในระบบ · ไม่ส่งไป Google Sheets จนกว่าจะตั้งค่าการเชื่อมต่อ',btn('ส่งออก CSV','export',reportType,'primary'))+filtersHtml()+`<div class="tabbar">${Object.entries(tabs).map(([key,label])=>btn(label,'report-tab',key,key===reportType?'active':'')).join('')}</div>${reportType==='standards'?notice('กิจกรรมอาจเชื่อมหลายมาตรฐาน งบในแต่ละมาตรฐานจึงอาจซ้อนกัน ไม่ควรบวกรวมข้ามมาตรฐาน'):''}<section class="panel"><div class="panel-header"><h2>${tabs[reportType]}</h2>${reportType==='plan'?btn('ตัวอย่างเล่มแผน','print-plan','','small'):''}</div>${reportType==='budget'?budgetTable():['strategy','quarter','standards'].includes(reportType)?groupedReport(reportType):['summaries','problems'].includes(reportType)?summaryReport(reportType==='problems'):projectTable(filteredProjects())}</section>`}
function taskList(tasks){return tasks.length?tasks.map(t=>`<div class="task-row"><div class="task-symbol">${t.overdue?'!':'◷'}</div><div class="task-info"><strong>${esc(t.title)}</strong><small>${t.dueDate?`กำหนด ${dateText(t.dueDate)}${t.overdue?' · เลยกำหนด':''}`:'งานรอดำเนินการ'}${t.projectId?` · ${esc(title(t.projectId))}`:''}</small></div>${btn('เปิด','open-task',t.id,'small')}</div>`).join(''):empty('ไม่มีงานค้างในขณะนี้','งานจะแสดงตามบทบาทและสถานะปัจจุบัน')}
function renderTasks(){const settings=state.settings||{};$('#page').innerHTML=heading('งานที่ฉันต้องทำ','รายการงานเปลี่ยนตามขั้นตอน และหยุดแสดงเมื่องานเสร็จ')+notice('แจ้งเตือนในแอปใช้งานได้ · การส่งผ่านโทรศัพท์ยังไม่เชื่อมจริง รอบแจ้งเตือนตั้งได้ด้านล่าง',true)+`<div class="grid-2"><section class="panel"><div class="panel-header"><h2>งานปัจจุบัน</h2>${btn('รีเฟรช','refresh','','small')}</div><div class="panel-body">${taskList(state.tasks||[])}</div></section><section class="panel"><div class="panel-header"><h2>กำหนดส่งและรอบแจ้งเตือน</h2></div><div class="panel-body">${has('planner','admin')?`<form id="settings-form"><div class="form-grid">${input('projectDeadline','กำหนดส่งโครงการ',settings.projectDeadline,'date')}${input('summaryDeadline','กำหนดส่งสรุป',settings.summaryDeadline,'date')}${input('reminderDays','แจ้งเตือนล่วงหน้า / รอบ (วัน)',settings.reminderDays || 7,'number','min="1" max="90" required')}</div><div class="error" role="alert"></div><button class="primary" type="submit" style="margin-top:16px">บันทึกกำหนดการ</button></form>`:`<p>ส่งโครงการ: ${dateText(settings.projectDeadline)}</p><p>ส่งสรุป: ${dateText(settings.summaryDeadline)}</p><p>รอบแจ้งเตือน: ${settings.reminderDays || 7} วัน</p>`}</div></section></div><section class="panel"><div class="panel-header"><h2>ประวัติการแจ้งเตือน</h2></div><div class="panel-body">${state.notifications?.length?state.notifications.slice().reverse().map(n=>`<div class="task-row"><div class="task-info"><strong>${esc(n.title || n.message || n.kind)}</strong><small>${dateText(n.createdAt || n.at)}</small></div>${n.readAt?badge('accepted'):btn('อ่านแล้ว','read-notification',n.id,'small')}</div>`).join(''):empty('ยังไม่มีการแจ้งเตือนใหม่')}</div></section>`}

function showPrint(heading,html,projectForm=false){showModal(heading,`${notice(projectForm?'แบบโครงการเรียง 19 หัวข้อตามต้นฉบับ พ.ศ. 2569 พร้อมหน้าพิจารณาแยกแผ่น ตรวจตัวอย่างก่อนพิมพ์ และแนบรายการทรัพยากรจากปุ่มพิมพ์ทรัพยากร':'ตัวอย่างพิมพ์จากข้อมูลในระบบ แบบเอกสารประเภทนี้ยังอยู่ระหว่างเทียบรูปแบบต้นฉบับ')}<div class="actions">${btn('พิมพ์ / บันทึก PDF','print-now','','primary')}</div><hr class="thin-divider"><div id="print-preview" class="print-doc">${html}</div>`,true)}

function printProject(id,resourceOnly=false,brand=false){const p=project(id);if(resourceOnly){showPrint('ตัวอย่างรายการทรัพยากร',`${printTitle(`รายการทรัพยากร${brand?'สำหรับพัสดุ (มียี่ห้อ)':'สำหรับเล่มแผน (ไม่มียี่ห้อ)'}`)}<h2>${esc(p.data.title)}</h2>${resourceTable(p.data,brand)}`);return}showPrint('ตัวอย่างแบบโครงการ',projectTemplateHtml(p.data,{references:state.references,statusLabel:statusNames[p.status],versionLabel:`ฉบับข้อมูล ${p.version}`}),true)}

async function uploadEvidence(form,pid){const ids=JSON.parse(form.dataset.evidence || '[]');const files=$('[name=evidence]',form)?.files || [];for(const file of files){if(file.size>5*1024*1024)throw new Error(`ไฟล์ ${file.name} ใหญ่เกิน 5 MB`);const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));reader.readAsDataURL(file)});const result=await api('/api/upload',{projectId:pid,name:file.name,type:file.type || 'application/octet-stream',data});ids.push(result.id);form.dataset.evidence=JSON.stringify(ids)}return ids}
function batchPreview(){const rows=state.projects.filter(p=>selected.has(p.id));if(!rows.length){toast('เลือกรายการที่ต้องการดำเนินการก่อน');return}showModal('ตรวจสอบก่อนดำเนินการหลายรายการ',`${notice(`ขอบเขต: เฉพาะ ${rows.length} รายการที่เลือกจากหน้าตรวจ / อนุมัติ ยอดรวม ${money(rows.reduce((a,p)=>a+totalData(p.data),0))} บาท`,true)}${projectTable(rows)}<form id="batch-form" data-items="${esc(JSON.stringify(rows.map(p=>({id:p.id,version:p.version}))))}" data-decision="${has('director')?'approve':'forward'}"><div class="error" role="alert"></div><div class="modal-footer">${btn('ยกเลิก','close')}<button class="primary" type="submit">ยืนยัน${has('director')?'อนุมัติ':'เสนอ ผอ.'} ${rows.length} รายการ</button></div></form>`,true)}
function exportCsv(type){if(type==='problems'){const table=$('#page table');if(!table){toast('ไม่มีข้อมูลสำหรับส่งออก');return}const csv='\uFEFF'+$$('tr',table).map(tr=>$$('th,td',tr).map(cell=>`"${cell.innerText.replace(/"/g,'""').replace(/^[=+@-]/,"'")}"`).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='hongson-problems.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}const params=new URLSearchParams({type,...reportFilters});window.location.href=`/api/export?${params}`}
document.addEventListener('click',async event=>{const control=event.target.closest('[data-action]');if(!control)return;const {action,id}=control.dataset;try{

  else if(action==='add-resource'){const form=control.closest('form');$('[data-resources]',form).insertAdjacentHTML('beforeend',resourceCard({},$$('[data-resource]',form).length));recalcResources(form)}
  else if(action==='remove-resource'){const form=control.closest('form');control.closest('[data-resource]').remove();recalcResources(form)}

  else if(action==='transition')transitionDialog(control.dataset.kind,id,control.dataset.decision);

  else if(action==='new-payment')paymentForm(id);

  else if(action==='view-version'){const v=state.versions.find(v=>v.id===id);showModal(`ฉบับอนุมัติ ${v.number}`,`${notice(`ฉบับคงที่ อนุมัติเมื่อ ${dateText(v.approvedAt)}`,true)}${btn('พิมพ์ฉบับอนุมัตินี้','print-version',v.id)}${projectDetails(v.data)}${resourceTable(v.data)}`,true)}
  else if(action==='print-project')printProject(id);

api = async function(path, data) {
  try { return await browserDemo.api(path, data); }
  catch (error) {
    if (error.status === 401 && path !== '/api/login') {
      expireSession();
      error.sessionExpired = true;
    }
    throw error;
  }
};

function demoDownload(name, content, type = 'application/octet-stream') {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = name;
  document.body.append(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

function demoCsvRows(type) {
  const rows = state.projects.filter(p => p.approvedVersionId).map(p => ({ p, data: approved(p) }))
    .filter(({ p, data }) => ['fiscalYear', 'academicYear', 'term', 'group'].every(key => !reportFilters[key] || String(data[key]) === String(reportFilters[key])) && (!reportFilters.projectId || p.id === reportFilters.projectId));
  const source = reportFilters.source;
  if (type === 'summaries') return [['รหัสกิจกรรม', 'กิจกรรม', 'สถานะสรุป', 'ความสำเร็จ (%)', 'ความพึงพอใจ (%)', 'จ่ายจริง (บาท)', 'ปัญหา'], ...rows.map(({ p, data }) => {
    const summary = state.summaries.find(item => item.projectId === p.id);
    return [p.id, data.title, summary?.status || 'ยังไม่ส่ง', summary?.data.success ?? '', summary?.data.scores?.length === 8 ? summary.data.scores.reduce((sum, value) => sum + Number(value), 0) / 32 * 100 : '', __domain.totals(state, p.id).paid / 100, (summary?.data.problems || []).map(item => `${item.category}: ${item.status} ${item.cause || ''}`).join('; ')];
  })];
  if (type === 'quarter') return [['รหัสกิจกรรม', 'กิจกรรม', 'ปีงบประมาณ', 'ภาคเรียน', 'เดือนใช้เงิน', 'แหล่งเงิน', 'ยอด (บาท)'], ...rows.flatMap(({ p, data }) => (data.resources || []).filter(row => !source || row.source === source).flatMap(row => (row.spending || []).map(month => [p.id, data.title, data.fiscalYear, data.term, month.month, row.source, month.amount / 100])))];
  if (['strategy', 'standards', 'plan'].includes(type)) return [['รหัสกิจกรรม', 'กิจกรรม', 'ปีงบประมาณ', 'ปีการศึกษา', 'ภาคเรียน', 'กลุ่มงาน', 'โครงการเชิงกลยุทธ์', 'กลยุทธ์', 'มาตรฐาน', 'งบอนุมัติ (บาท)'], ...rows.map(({ p, data }) => [p.id, data.title, data.fiscalYear, data.academicYear, data.term, data.group, data.strategicProjectName || data.strategicProjectId, data.strategy, (data.standards || []).join('; '), (source ? __domain.totals(state, p.id).bySource[source]?.approved || 0 : __domain.totals(state, p.id).approved) / 100])];
  if (type === 'problems') {
    const table = $('#page table');
    if (!table) throw new Error('ไม่มีข้อมูลสำหรับส่งออก');
    return $$('tr', table).map(row => $$('th,td', row).map(cell => cell.innerText));
  }
  return [['รหัสกิจกรรม', 'กิจกรรม', 'ปีงบประมาณ', 'ภาคเรียน', 'กลุ่มงาน', 'แหล่งเงิน', 'อนุมัติ (บาท)', 'กันไว้ค้างจ่าย (บาท)', 'จ่ายจริง (บาท)', 'คงเหลือ (บาท)'], ...rows.flatMap(({ p, data }) => Object.entries(__domain.totals(state, p.id).bySource).filter(([name]) => !source || name === source).map(([name, sum]) => [p.id, data.title, data.fiscalYear, data.term, data.group, name, sum.approved / 100, sum.reserved / 100, sum.paid / 100, sum.available / 100]))];
}

exportCsv = function(type) {
  const csv = '\uFEFF' + demoCsvRows(type).map(row => row.map(value => {
    let text = String(value ?? '');
    if (/^[=+@\-\t\r]/.test(text)) text = "'" + text;
    return '"' + text.replaceAll('"', '""') + '"';
  }).join(',')).join('\r\n');
  demoDownload(`hongson-${type}.csv`, csv, 'text/csv;charset=utf-8');
};

document.addEventListener('submit', async event => {
  const form = event.target;
  if (form.id !== 'demo-import-form') return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const button = $('[type=submit]', form);
  if (button.disabled) return;

    if (!$('[name=confirmed]', form).checked) throw new Error('กรุณายืนยันแทนที่ข้อมูลก่อนนำเข้า');
    const file = $('[name=backup]', form).files[0];
    if (!file) throw new Error('กรุณาเลือกไฟล์สำรอง');
    if (file.size > 50 * 1024 * 1024) throw new Error('ไฟล์สำรองต้องไม่เกิน 50 MB');

    clearSession();
    toast('นำเข้าข้อมูลแล้ว กรุณาเลือกบทบาททดลอง');
  } catch (error) { showError(error, form); }
  finally { button.disabled = false; }
}, true);
